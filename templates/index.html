<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Connect instantly with anyone, anywhere in the world.">
    <title>World Chat | Welcome</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="login">
        <form class="form" action="/" method="POST">
            <h1>WORLD CHAT</h1>
            <p style="text-align: center; color: var(--text-secondary); margin-top: -1rem; font-size: 0.9rem;">Join the global conversation</p>
            <div class="input-group">
                <input class="in" required placeholder="Choose a username..." id="in" name="username" autocomplete="off">
            </div>
            <button class="button" type="submit">Enter Chat</button>
        </form>
    </div>
</body>
</html>
